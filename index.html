      content="Assurance auto temporaire de 1 à 90 jours. Attestation immédiate en 5 minutes, sans relevé d'information. 34 pays couverts. Devis gratuit en ligne."
    />

    <!--
      Visuel de partage, commun a tout le site.

      Pose ICI, dans le gabarit, et non page par page : chaque page definit deja
      ses og:title, og:description et og:url via Helmet, que prerender.mjs hisse
      dans ce <head>. Aucune n'a jamais defini d'og:image, si bien que les 80
      pages partaient sans visuel : un partage sur LinkedIn, WhatsApp ou X
      n'affichait qu'un rectangle vide. Une valeur par defaut au niveau du
      gabarit couvre tout le site d'un coup, et reste surchargeable page par
      page le jour ou une page meritera son propre visuel.

      L'image est produite par `node scripts/og-image.mjs` a partir de
      scripts/og-image.html, en Chrome sans interface : aucune dependance npm
      ajoutee, et le visuel se regenere si la marque evolue.

      URL absolue obligatoire : les robots des reseaux sociaux ne resolvent pas
      les chemins relatifs.
    -->
    <meta property="og:image" content="https://assutempo.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="AssuTempo, l'assurance temporaire qui change tout. De 1 à 90 jours, attestation en 5 minutes."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://assutempo.fr/og-image.png" />
