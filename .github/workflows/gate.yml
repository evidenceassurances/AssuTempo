# Portique de controle des Pull Requests + merge automatique.
#
# Deux portes d'entree :
#  - pull_request : PR ouvertes normalement (dependabot, humains).
#  - workflow_dispatch (pr_number) : appele par Claude Mission en fin de job,
#    car une PR creee avec GITHUB_TOKEN ne declenche pas les workflows
#    (anti-boucle GitHub) ; seul workflow_dispatch fait exception.
#
# Job "contexte" : resout la PR (branche, auteur, label hold) quelle que soit
# la porte d'entree. Job "gate" : build complet puis scripts/quality-gate.mjs.
# Job "automerge" : si le gate est vert, merge en squash les PR draft/ ou
# claude/ des bots et d'Ayoub (et les PR dependabot limitees aux workflows),
# sauf si le label "hold" est pose.
#
# Un merge effectue avec le token Actions ne declenche pas les autres
# workflows : Vercel deploie quand meme (integration directe GitHub), et le
# ping IndexNow est enchaine ici meme apres le merge.
name: Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numero de la Pull Request a controler'
        required: true

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  contexte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.infos.outputs.pr }}
      branche: ${{ steps.infos.outputs.branche }}
      auteur: ${{ steps.infos.outputs.auteur }}
      hold: ${{ steps.infos.outputs.hold }}
    steps:
      - name: Resoudre la PR
        id: infos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number || inputs.pr_number }}"
          infos=$(gh pr view "$pr" --repo ${{ github.repository }} --json state,headRefName,author,labels)
          etat=$(echo "$infos" | jq -r '.state')
          if [ "$etat" != "OPEN" ]; then
            echo "PR #${pr} non ouverte (etat : ${etat}) : rien a controler."
            exit 1
          fi
          # Le login d'auteur n'a pas une forme unique : `gh pr view --json
          # author` passe par GraphQL, qui prefixe les applications ("app/
          # dependabot", "app/github-actions"), la ou l'API REST suffixe
          # ("dependabot[bot]"). Tester une forme particuliere casse en silence
          # des que l'autre apparait : c'est ce qui bloquait la PR #36 depuis le
          # 17 juillet (exemption dependabot jamais activee, donc rejet en zone
          # interdite sur .github/workflows/). On normalise ici, une fois, et
          # tout l'aval compare des logins nus.
          brut=$(echo "$infos" | jq -r '.author.login')
          auteur=$(echo "$brut" | tr '[:upper:]' '[:lower:]' | sed -e 's|^app/||' -e 's|\[bot\]$||')
          echo "Auteur de la PR : brut='${brut}' normalise='${auteur}'"
          {
            echo "pr=${pr}"
            echo "branche=$(echo "$infos" | jq -r '.headRefName')"
            echo "auteur=${auteur}"
            echo "hold=$(echo "$infos" | jq -r '[.labels[].name] | contains(["hold"])')"
          } >> "$GITHUB_OUTPUT"

  gate:
    needs: contexte
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.contexte.outputs.branche }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Installer les dependances
        run: npm ci
      - name: Build complet (Vite + prerender)
        run: npm run build
      - name: Controles qualite
        env:
          GATE_AUTHOR: ${{ needs.contexte.outputs.auteur }}
        run: node scripts/quality-gate.mjs

  automerge:
    needs: [contexte, gate]
    if: >-
      needs.contexte.outputs.hold != 'true' &&
      (
        ((startsWith(needs.contexte.outputs.branche, 'draft/') || startsWith(needs.contexte.outputs.branche, 'claude/')) &&
         contains(fromJSON('["claude", "github-actions", "evidenceassurances"]'), needs.contexte.outputs.auteur)) ||
        (needs.contexte.outputs.auteur == 'dependabot' &&
         startsWith(needs.contexte.outputs.branche, 'dependabot/'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # issues: write est indispensable a l'etape "Fermer l'issue liee" :
      # sans elle, gh issue close echoue (Resource not accessible by
      # integration) et le || true masque l'echec. Constate sur la PR #13
      # (issue #12 restee ouverte) ; l'issue #6 avait ete fermee a la main.
      issues: write
    steps:
      - name: Verifier le perimetre dependabot (workflows uniquement)
        if: needs.contexte.outputs.auteur == 'dependabot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hors_perimetre=$(gh pr view ${{ needs.contexte.outputs.pr }} \
            --repo ${{ github.repository }} --json files \
            --jq '.files[].path | select(startswith(".github/workflows/") | not)')
          if [ -n "$hors_perimetre" ]; then
            echo "PR dependabot refusee, fichiers hors .github/workflows/ :"
            echo "$hors_perimetre"
            exit 1
          fi

      # GitHub REFUSE qu'un jeton d'application merge une PR qui touche un
      # fichier de .github/workflows/ : c'est le garde-fou qui empeche un
      # workflow de se reecrire lui-meme. Il n'existe aucune permission
      # `workflows` attribuable au GITHUB_TOKEN (la liste des permissions de
      # job ne la contient pas), donc ce blocage ne se contourne pas par
      # configuration : il faudrait un PAT ou une GitHub App portant le scope
      # `workflow`. Or dependabot sur l'ecosysteme github_actions ne modifie
      # QUE des fichiers de workflow : ces PR ne peuvent donc jamais etre
      # auto-mergees. Sans ce garde-fou, l'automerge echouait sur un message
      # GraphQL cryptique et la PR restait ouverte sans explication : la PR #36
      # est restee bloquee ainsi du 17 juillet au 12 aout 2026. On detecte
      # desormais le cas AVANT le merge, on l'explique sur la PR, et on sort
      # proprement : c'est une intervention humaine attendue, pas une panne.
      - name: Detecter les PR non auto-mergeables (fichiers de workflow)
        id: perimetre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touche_workflows=$(gh pr view ${{ needs.contexte.outputs.pr }} \
            --repo ${{ github.repository }} --json files \
            --jq '.files[].path | select(startswith(".github/workflows/"))')
          if [ -n "$touche_workflows" ]; then
            echo "bloque=true" >> "$GITHUB_OUTPUT"
            echo "Merge automatique impossible : cette PR modifie des fichiers de workflow."
            echo "$touche_workflows"
          else
            echo "bloque=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Expliquer sur la PR et laisser la main
        if: steps.perimetre.outputs.bloque == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ needs.contexte.outputs.pr }} --repo ${{ github.repository }} --body \
          "Gate vert, mais le merge automatique est impossible sur cette PR : elle modifie des fichiers de \`.github/workflows/\`, et GitHub interdit au jeton d'Actions de merger un changement de workflow (aucune permission \`workflows\` n'existe pour ce jeton). Un merge manuel est necessaire. Tous les controles qualite sont passes." \
          || true

      # Une branche de mission part de main et vit le temps de la mission. Si
      # main avance pendant ce temps, `gh pr merge` echoue sur "the merge commit
      # cannot be cleanly created", sans rien ecrire sur la PR : c'est ce qui a
      # immobilise la PR #41 du 30 juillet au 12 aout 2026, alors que son Gate
      # etait vert et son contenu bon a publier. On rattrape donc la branche
      # AVANT d'essayer, ce qui resout le cas courant (branche simplement en
      # retard, sans conflit reel).
      #
      # Pousser avec le GITHUB_TOKEN ne redeclenche aucun workflow (anti-boucle
      # GitHub) : ce rattrapage ne peut donc pas annuler le run en cours via la
      # concurrency. En revanche GitHub recalcule la fusionnabilite de maniere
      # asynchrone et renvoie UNKNOWN pendant ce temps : on attend le verdict.
      - name: Rattraper la branche sur main
        id: rattrapage
        if: steps.perimetre.outputs.bloque != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.contexte.outputs.pr }}
        run: |
          if gh pr update-branch "$PR" --repo "$REPO"; then
            echo "Branche rattrapee sur main."
          else
            echo "Rattrapage non applique : deja a jour, ou conflit que GitHub ne sait pas resoudre seul."
          fi
          etat=UNKNOWN
          for i in $(seq 1 12); do
            etat=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable')
            echo "  verdict de fusionnabilite (tentative $i) : $etat"
            [ "$etat" != "UNKNOWN" ] && break
            sleep 5
          done
          echo "mergeable=$etat" >> "$GITHUB_OUTPUT"

      - name: Merge automatique (squash + suppression de branche)
        id: merge
        if: steps.perimetre.outputs.bloque != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge ${{ needs.contexte.outputs.pr }}
          --repo ${{ github.repository }} --squash --delete-branch

      # Le merge a echoue malgre le rattrapage : conflit reel, arbitrage humain.
      # Le label hold empeche de reessayer en boucle au prochain declenchement,
      # et le commentaire laisse enfin une trace lisible sur la PR.
      - name: Signaler un merge impossible et poser le label hold
        if: steps.perimetre.outputs.bloque != 'true' && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.contexte.outputs.pr }}
          ETAT: ${{ steps.rattrapage.outputs.mergeable }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body \
          "Gate vert, mais le merge automatique a echoue : la branche ne se fusionne pas proprement dans \`main\` (etat GitHub : \`$ETAT\`). Le rattrapage automatique sur \`main\` n'a pas suffi, il reste des conflits a arbitrer a la main. Le label \`hold\` est pose pour eviter de reessayer en boucle : le retirer une fois les conflits resolus, puis relancer le Gate." || true
          gh pr edit "$PR" --repo "$REPO" --add-label hold || true
          echo "Merge impossible : arbitrage humain demande sur la PR #$PR."
          exit 1

      # Le mot-cle "Closes #N" d'une PR mergee par le token Actions ne ferme
      # pas l'issue de façon fiable : fermeture explicite.
      # Toutes les etapes qui suivent supposent que le merge a EFFECTIVEMENT eu
      # lieu : sans la garde, une PR laissee a l'arbitrage humain fermait quand
      # meme son issue, puis reconstruisait et signalait a IndexNow un main
      # inchange. On teste l'issue du merge, pas seulement le perimetre : un
      # `if:` explicite remplace le controle de succes implicite d'Actions, donc
      # ces etapes tourneraient malgre l'echec de l'etape precedente.
      - name: Fermer l'issue liee
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh pr view ${{ needs.contexte.outputs.pr }} --repo ${{ github.repository }} \
            --json body --jq '.body' | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+') || true
          if [ -n "$num" ]; then
            gh issue close "$num" --repo ${{ github.repository }} \
              --comment "Mission publiee : PR #${{ needs.contexte.outputs.pr }} mergee automatiquement apres controle du Gate." || true
          fi

      - name: Checkout de main apres merge
        if: steps.merge.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        if: steps.merge.outcome == 'success'
        with:
          node-version: 20
          cache: npm
      - name: Rebuild du sitemap sur main mergee
        if: steps.merge.outcome == 'success'
        run: |
          npm ci
          npm run build
      - name: Ping IndexNow (Bing prevenu en minutes)
        if: steps.merge.outcome == 'success'
        run: node scripts/indexnow.mjs
