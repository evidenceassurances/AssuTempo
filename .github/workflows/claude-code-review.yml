name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # GitHub ne transmet pas les secrets aux runs declenches par dependabot :
    # la revue echouerait systematiquement, on la saute (le Gate suffit).
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Les PR de mission sont ouvertes par l'application Claude : l'acteur
          # du run est alors le bot "claude", et l'action refuse par defaut
          # tout declencheur non humain. Sans cette ligne, la revue echoue sur
          # CHAQUE PR de mission (erreur "Workflow initiated by non-human
          # actor: claude"), constatee sur les PR des issues 29, 38, 43, 46, 49.
          # On nomme le bot explicitement : le depot est PUBLIC, et le joker
          # '*' y laisserait des applications tierces declencher l'action avec
          # un prompt qu'elles controlent.
          allowed_bots: "claude"
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

