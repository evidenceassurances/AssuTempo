# Pilote automatique AssuTempo : toute issue ou commentaire contenant
# @claude declenche Claude Code dans le cloud GitHub. Il travaille seul
# (redaction, build, branche draft, Pull Request) ; le merge reste la
# decision d'Ayoub. Les regles permanentes sont dans CLAUDE.md.
name: Claude Mission

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-mission
  cancel-in-progress: false

jobs:
  mission:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Les outils de base de l'action (edition de fichiers, commits, commentaires,
      # operations GitHub) sont toujours inclus : --allowedTools s'y AJOUTE.
      # WebSearch/WebFetch : verification des chiffres legaux en ligne (YMYL).
      # Bash npm/node : npm ci puis npm run build pour livrer un build propre.
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools "WebSearch,WebFetch,Bash(npm ci:*),Bash(npm install:*),Bash(npm run build:*),Bash(node:*)"
