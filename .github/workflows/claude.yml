# Pilote automatique AssuTempo : toute issue ou commentaire contenant
# @claude declenche Claude Code dans le cloud GitHub. Il travaille seul
# (redaction, build, branche draft, Pull Request) ; le merge reste la
# decision d'Ayoub. Les regles permanentes sont dans CLAUDE.md.
name: Claude Mission

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-mission
  cancel-in-progress: false

jobs:
  mission:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 40 --model claude-sonnet-5'
