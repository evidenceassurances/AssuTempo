# Pilote automatique AssuTempo : toute issue ou commentaire contenant
# @claude declenche Claude Code dans le cloud GitHub. L'action epingle la
# mission sur une branche claude/issue-N-* (elle ne peut ni creer d'autre
# branche ni ouvrir de Pull Request) : le post-traitement en fin de job
# ouvre donc la PR et declenche le Gate, qui controle puis merge tout seul.
# Les regles permanentes sont dans CLAUDE.md.
name: Claude Mission

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  mission:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    # Concurrency au niveau du JOB et par issue : un run sans @claude (job
    # skipped) ne prend pas de place dans la file, et deux missions sur des
    # issues differentes tournent en parallele sans s'ejecter mutuellement.
    # GitHub ne garde qu'un seul run en attente par groupe : au niveau
    # workflow, chaque commentaire ejectait la mission precedente de la file.
    concurrency:
      group: claude-mission-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Outils accordes explicitement : le run du 11 juillet a prouve que les
      # outils de base de l'action ne suffisent PAS (12 refus de permission,
      # branche claude/issue-* jamais creee, d'ou le HttpError 404 en fin de
      # job). On accorde donc Bash + outils de fichiers (Edit, Write, Read,
      # Glob, Grep) et les commandes git de la mission (add, commit, push,
      # checkout, branch), listees aussi individuellement pour survivre a un
      # eventuel retrait du Bash global.
      # WebSearch/WebFetch : verification des chiffres legaux en ligne (YMYL).
      # Bash npm/node : npm ci puis npm run build pour livrer un build propre.
      - name: Run Claude Code
        id: mission
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 200
            --model claude-sonnet-5
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebSearch,WebFetch,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git branch:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm run build:*),Bash(node:*)"

      # Filet d'alerte. Quand l'etape Claude echoue (jeton expire ou revoque,
      # plafond d'usage atteint, plantage), l'issue restait MUETTE : elle
      # semblait simplement en attente, et la panne pouvait durer des semaines
      # sans que personne la voie. On commente donc l'issue avec le motif et
      # le lien du run. Double securite anti-boucle : un evenement cree avec le
      # GITHUB_TOKEN ne declenche aucun workflow, ET le texte ne contient
      # jamais la mention de declenchement (sinon, jeton mort = pluie de
      # commentaires). Ne JAMAIS ecrire cette mention dans ce corps de message.
      - name: Signaler une mission en echec
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "Mission interrompue : elle s'est arretee en erreur, aucun fichier n'a ete publie.

          Causes frequentes, dans l'ordre : jeton \`CLAUDE_CODE_OAUTH_TOKEN\` expire ou revoque, plafond d'usage atteint, ou depassement des 45 minutes de la mission.

          Journal complet : ${RUN}

          Pour relancer une fois la cause levee : commenter cette issue en mentionnant Claude, comme pour une mission normale."
      # Un evenement cree avec GITHUB_TOKEN ne declenche pas les workflows
      # (anti-boucle GitHub), SAUF workflow_dispatch : c'est l'exception
      # documentee qui permet d'enchainer sur le Gate sans intervention.
      - name: Ouvrir la PR et declencher le Gate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TITRE: ${{ github.event.issue.title }}
          EST_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          if [ "$EST_PR" = "true" ]; then
            # Commentaire @claude sur une PR : la PR existe deja, c'est l'issue elle-meme.
            pr="$ISSUE"
          else
            branche=$(git ls-remote --heads origin "claude/issue-${ISSUE}-*" | sed 's|.*refs/heads/||' | sort | tail -1)
            if [ -z "$branche" ]; then
              echo "Aucune branche poussee par la mission : rien a publier (reponse en commentaire uniquement)."
              exit 0
            fi
            pr=$(gh pr list --repo "$REPO" --head "$branche" --state open --json number --jq '.[0].number // empty')
            if [ -z "$pr" ]; then
              url=$(gh pr create --repo "$REPO" --base main --head "$branche" \
                --title "draft: $TITRE" \
                --body "Mission automatique (issue #${ISSUE}). Controlee par le workflow Gate : merge automatique si tous les controles passent. Closes #${ISSUE}.")
              pr=$(basename "$url")
            fi
          fi
          echo "PR #${pr} : declenchement du Gate."
          gh workflow run gate.yml --repo "$REPO" --ref main -f pr_number="$pr"
